<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 285" width="100%" height="100%">
  <defs>
    <linearGradient id="expCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11151e" />
      <stop offset="100%" stop-color="#0b0d12" />
    </linearGradient>
    <linearGradient id="posBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#172030" />
    </linearGradient>
  </defs>

  <!-- LEFT CARD: PT Pos Indonesia (PKL) -->
  <g transform="translate(0, 0)">
    <rect width="588" height="285" rx="20" fill="url(#expCard)" stroke="#9cb7db" stroke-opacity="0.24" stroke-width="1.4" />
    <rect x="28" y="26" width="235" height="26" rx="13" fill="url(#posBadge)" stroke="#9cb7db" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="44" cy="39" r="3.5" fill="#9cb7db" />
    <text x="56" y="43" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.2" fill="#c7d8ee">INDUSTRY INTERNSHIP (PKL)</text>
    <text x="560" y="43" text-anchor="end" font-family="'SF Mono', Consolas, monospace" font-size="10.5" fill="#8b929e">BANDUNG, ID</text>

    <text x="28" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" letter-spacing="-0.6" fill="#f5f4f0">PT Pos Indonesia</text>
    <text x="28" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#9cb7db">Operations Control Division  (Bagian Pengendalian Operasi)</text>

    <line x1="28" y1="128" x2="560" y2="128" stroke="#f5f4f0" stroke-opacity="0.08" stroke-width="1" />

    <text x="28" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#b0b7c3">• Built internal web applications &amp; operational control dashboards for shipment monitoring.</text>
    <text x="28" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#b0b7c3">• Developed a Local AI Shipment Agent (Ollama + MongoDB) for delivery exception analysis.</text>
    <text x="28" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#b0b7c3">• Executed iPOS5 master office data validation, regional mapping &amp; image annotation workflows.</text>

    <g transform="translate(28, 232)" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#d0d7e2">
      <rect x="0" y="0" width="128" height="26" rx="8" fill="#181d29" stroke="#f5f4f0" stroke-opacity="0.1" />
      <text x="64" y="17" text-anchor="middle">Operations Control</text>
      <rect x="138" y="0" width="118" height="26" rx="8" fill="#181d29" stroke="#f5f4f0" stroke-opacity="0.1" />
      <text x="197" y="17" text-anchor="middle">Ollama + MongoDB</text>
      <rect x="266" y="0" width="112" height="26" rx="8" fill="#181d29" stroke="#f5f4f0" stroke-opacity="0.1" />
      <text x="322" y="17" text-anchor="middle">POSO &amp; iPOS5</text>
      <rect x="388" y="0" width="134" height="26" rx="8" fill="#181d29" stroke="#f5f4f0" stroke-opacity="0.1" />
      <text x="455" y="17" text-anchor="middle">Logistics Analytics</text>
    </g>
  </g>

  <!-- RIGHT CARD: SMK Software Engineering (RPL) -->
  <g transform="translate(612, 0)">
    <rect width="588" height="285" rx="20" fill="url(#expCard)" stroke="#f5f4f0" stroke-opacity="0.14" stroke-width="1.4" />
    <rect x="28" y="26" width="235" height="26" rx="13" fill="url(#posBadge)" stroke="#f5f4f0" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="44" cy="39" r="3.5" fill="#f5f4f0" />
    <text x="56" y="43" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.2" fill="#e5e7eb">ACADEMIC BACKGROUND</text>
    <text x="560" y="43" text-anchor="end" font-family="'SF Mono', Consolas, monospace" font-size="10.5" fill="#8b929e">VOCATIONAL HIGH SCHOOL</text>

    <text x="28" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" letter-spacing="-0.6" fill="#f5f4f0">Software Engineering (SMK — RPL)</text>
    <text x="28" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#9cb7db">Rekayasa Perangkat Lunak  ·  Full-Stack &amp; Creative Computing</text>

    <line x1="28" y1="128" x2="560" y2="128" stroke="#f5f4f0" stroke-opacity="0.08" stroke-width="1" />

    <text x="28" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#b0b7c3">• Strong foundation in web engineering, object-oriented programming &amp; relational databases.</text>
    <text x="28" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#b0b7c3">• Hands-on development with PHP, Laravel, React, TypeScript, Node.js, Python &amp; MySQL.</text>
    <text x="28" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#b0b7c3">• Active creator of interactive web tools (Photobooth, GlyphLab), 3D scenes &amp; local AI systems.</text>

    <g transform="translate(28, 232)" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#d0d7e2">
      <rect x="0" y="0" width="122" height="26" rx="8" fill="#181d29" stroke="#f5f4f0" stroke-opacity="0.1" />
      <text x="61" y="17" text-anchor="middle">PHP &amp; Laravel</text>
      <rect x="132" y="0" width="136" height="26" rx="8" fill="#181d29" stroke="#f5f4f0" stroke-opacity="0.1" />
      <text x="200" y="17" text-anchor="middle">React &amp; TypeScript</text>
      <rect x="278" y="0" width="122" height="26" rx="8" fill="#181d29" stroke="#f5f4f0" stroke-opacity="0.1" />
      <text x="339" y="17" text-anchor="middle">MySQL &amp; NoSQL</text>
      <rect x="410" y="0" width="118" height="26" rx="8" fill="#181d29" stroke="#f5f4f0" stroke-opacity="0.1" />
      <text x="469" y="17" text-anchor="middle">UI/UX &amp; WebGL</text>
    </g>
  </g>
</svg>
