<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d12" />
      <stop offset="50%" stop-color="#11151f" />
      <stop offset="100%" stop-color="#090b0f" />
    </linearGradient>
    <radialGradient id="orbBlue" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6887b1" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#6887b1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#6887b1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbWarm" cx="15%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#f5f4f0" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#f5f4f0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10131b" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accentPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9cb7db" />
      <stop offset="100%" stop-color="#c9dcf5" />
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f5f4f0" fill-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="430" rx="24" fill="url(#bgMain)" />
  <rect width="1200" height="430" rx="24" fill="url(#dotGrid)" />
  <rect width="1200" height="430" rx="24" fill="url(#orbBlue)" />
  <rect width="1200" height="430" rx="24" fill="url(#orbWarm)" />
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#f5f4f0" stroke-opacity="0.14" stroke-width="1.5" />

  <!-- Decorative Orbital Rings on Right -->
  <g transform="translate(920, 215)" opacity="0.22">
    <circle cx="0" cy="0" r="170" fill="none" stroke="#9cb7db" stroke-width="1" stroke-dasharray="6 8" />
    <circle cx="0" cy="0" r="235" fill="none" stroke="#f5f4f0" stroke-width="0.7" stroke-opacity="0.5" />
  </g>

  <!-- LEFT SIDE: Editorial Identity -->
  <!-- Top Status Badge -->
  <g transform="translate(54, 46)">
    <rect width="388" height="32" rx="16" fill="#f5f4f0" fill-opacity="0.06" stroke="#f5f4f0" stroke-opacity="0.16" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="20" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#e5e7eb">SOFTWARE ENGINEERING (RPL)  •  BANDUNG, ID</text>
  </g>

  <!-- Main Display Name -->
  <text x="54" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.6" fill="#f5f4f0">Muhamad Eldi</text>

  <!-- AIBEL Editorial Pill -->
  <g transform="translate(54, 168)">
    <rect width="126" height="30" rx="15" fill="url(#accentPill)" />
    <text x="63" y="19.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1.2" fill="#0b0d12">AKA AIBEL</text>
    <text x="144" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="600" fill="#c7d8ee">Full-Stack Developer  ·  Creative Technologist  ·  AI Explorer</text>
  </g>

  <!-- Bio Lead -->
  <text x="54" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" fill="#9ca3af">Turning ideas into real digital experiences — combining clean, interactive interfaces</text>
  <text x="54" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" fill="#9ca3af">with structured backend architecture, operational data systems, and local AI agents.</text>

  <!-- Bottom Left Highlight Pills -->
  <g transform="translate(54, 292)">
    <rect x="0" y="0" width="295" height="44" rx="12" fill="#151923" stroke="#9cb7db" stroke-opacity="0.28" stroke-width="1" />
    <text x="16" y="18" font-family="'SF Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.2" fill="#9cb7db" font-weight="600">INDUSTRY INTERNSHIP (PKL)</text>
    <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#f5f4f0">PT Pos Indonesia · Operations Control</text>

    <rect x="310" y="0" width="285" height="44" rx="12" fill="#151923" stroke="#f5f4f0" stroke-opacity="0.14" stroke-width="1" />
    <text x="326" y="18" font-family="'SF Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.2" fill="#9ca3af" font-weight="600">ACADEMIC VOCATION</text>
    <text x="326" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#f5f4f0">SMK · Rekayasa Perangkat Lunak (RPL)</text>
  </g>

  <!-- Bottom Bar -->
  <line x1="54" y1="364" x2="650" y2="364" stroke="#f5f4f0" stroke-opacity="0.1" stroke-width="1" />
  <text x="54" y="392" font-family="'SF Mono', Consolas, monospace" font-size="11" letter-spacing="1" fill="#9cb7db" font-weight="600">LIVE WEB PORTFOLIO  →  https://meldi0.github.io/aibel-works/</text>

  <!-- RIGHT SIDE: Glass Developer Identity Window -->
  <g transform="translate(696, 44)">
    <rect width="450" height="342" rx="18" fill="url(#glassCard)" stroke="#f5f4f0" stroke-opacity="0.16" stroke-width="1.2" />
    <!-- Window Top Bar -->
    <rect width="450" height="40" rx="18" fill="#0c0e14" fill-opacity="0.7" />
    <circle cx="22" cy="20" r="5" fill="#f87171" fill-opacity="0.8" />
    <circle cx="38" cy="20" r="5" fill="#facc15" fill-opacity="0.8" />
    <circle cx="54" cy="20" r="5" fill="#4ade80" fill-opacity="0.8" />
    <text x="225" y="24" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8b929e">aibel@profile : ~/identity.json</text>
    <line x1="0" y1="40" x2="450" y2="40" stroke="#f5f4f0" stroke-opacity="0.09" stroke-width="1" />

    <!-- JSON Profile Content -->
    <g transform="translate(26, 70)" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="12">
      <text x="0" y="0" fill="#8b929e">{</text>

      <text x="18" y="26" fill="#9cb7db">"developer"</text>
      <text x="112" y="26" fill="#8b929e">:</text>
      <text x="126" y="26" fill="#f5f4f0" font-weight="600">"Muhamad Eldi (AIBEL)"</text>

      <text x="18" y="54" fill="#9cb7db">"education"</text>
      <text x="112" y="54" fill="#8b929e">:</text>
      <text x="126" y="54" fill="#e5e7eb">"SMK — Software Engineering (RPL)"</text>

      <text x="18" y="82" fill="#9cb7db">"internship"</text>
      <text x="112" y="82" fill="#8b929e">:</text>
      <text x="126" y="82" fill="#4ade80" font-weight="600">"PT Pos Indonesia"</text>

      <text x="18" y="110" fill="#9cb7db">"division"</text>
      <text x="112" y="110" fill="#8b929e">:</text>
      <text x="126" y="110" fill="#f5f4f0">"Operations Control"</text>
      <text x="126" y="128" fill="#8b929e" font-size="11">(Bagian Pengendalian Operasi)</text>

      <text x="18" y="158" fill="#9cb7db">"coreStack"</text>
      <text x="112" y="158" fill="#8b929e">:</text>
      <text x="126" y="158" fill="#c7d8ee">["React", "TypeScript", "Laravel",</text>
      <text x="126" y="178" fill="#c7d8ee"> "PHP", "Node.js", "Python",</text>
      <text x="126" y="198" fill="#c7d8ee"> "Ollama AI", "MySQL", "MongoDB"]</text>

      <text x="18" y="226" fill="#9cb7db">"location"</text>
      <text x="112" y="226" fill="#8b929e">:</text>
      <text x="126" y="226" fill="#e5e7eb">"Bandung, West Java, ID"</text>

      <text x="0" y="252" fill="#8b929e">}</text>
    </g>
  </g>
</svg>
